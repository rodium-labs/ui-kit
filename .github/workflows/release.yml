name: Release

# Publishing is driven by a tag, so the version that goes out is always the one
# recorded in the history. v0.1.0 publishes the packages at 0.1.0.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # required for npm provenance and for trusted publishing over OIDC
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or later. pinned to the major rather
      # than to latest, which moves onto node versions this runner does not have.
      - name: Use a current npm
        run: npm install -g npm@11

      - run: bun install --frozen-lockfile

      - name: Refuse a tag that disagrees with the manifests
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in tokens ui; do
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$TAG" != "$VERSION" ]; then
              echo "tag $GITHUB_REF_NAME does not match @rodium-labs/$pkg@$VERSION"
              exit 1
            fi
          done
          echo "tag and manifests agree on $TAG"

      - name: Lint and formatting
        run: bunx biome ci .

      - name: Colour tokens resolve
        run: node tools/check-tokens.mjs

      - name: Types
        run: bun run typecheck

      - name: Build the packages
        run: bun run build:packages

      # tokens first: the components declare it as a peer
      # no NODE_AUTH_TOKEN: the registry credential is exchanged from the
      # workflow's OIDC token, which is what id-token: write above grants
      - name: Publish @rodium-labs/tokens
        run: npm publish -w @rodium-labs/tokens --provenance --access public

      - name: Publish @rodium-labs/ui
        run: npm publish -w @rodium-labs/ui --provenance --access public
